packages:
  all:
    target: [sapphire-rapids]

    providers:
      mpi: [openmpi]

  c:
    require:
    - gcc@=14.2.1
  cxx:
    require:
    - gcc@=14.2.1
  fortran:
    require:
    - gcc@=14.2.1

  gcc:
    externals:
    - spec: gcc@14.2.1 languages:='c,c++,fortran'
      prefix: /opt/rh/gcc-toolset-14/root/usr/
      extra_attributes:
        compilers:
          c: /opt/rh/gcc-toolset-14/root/usr/bin/gcc
          cxx: /opt/rh/gcc-toolset-14/root/usr/bin/g++
          fortran: /opt/rh/gcc-toolset-14/root/usr/bin/gfortran
    buildable: false

  openmpi:
    externals:
    - spec: openmpi@4.1
      prefix: /opt/toss/openmpi/4.1/gnu
    buildable: false

  python:
    externals:
    - spec: python@3.11.6+bz2+crypt+ctypes+dbm+lzma+pyexpat+pythoncmd+readline+sqlite3+ssl~tkinter+uuid+zlib
      prefix: /projects/aue/hpc/builds/x86_64/rhel8/f6a36cb8/tooling-sprint-24.02/install/linux-rhel8-x86_64/gcc-10.3.0/python-3.11.6-qvlrkva
    buildable: false
